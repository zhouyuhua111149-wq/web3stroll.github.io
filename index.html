<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WEB3STROLL | VIDEO TURBO</title>
    <style>
        body { 
            margin: 0; padding: 5px; background: #000; color: #0f0; 
            font-family: 'Consolas', monospace; overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent; 
        }

        .grid-matrix { 
            display: grid; grid-template-columns: repeat(6, 1fr); 
            gap: 6px; width: 100%; margin: 0 auto;
        }

        @media (max-width: 900px) { 
            .grid-matrix { grid-template-columns: repeat(3, 1fr); gap: 4px; } 
        }

        .unit-card { 
            border: 1px solid #1a1a1a; background: #0a0a0a; 
            aspect-ratio: 1/1; position: relative; overflow: hidden; 
            cursor: pointer; 
        }
        
        .poster { width: 100%; height: 100%; object-fit: cover; }

        .unit-id { 
            position: absolute; bottom: 0; right: 0; 
            font-size: 12px; color: #0f0; 
            background: rgba(0,0,0,0.85); 
            padding: 2px 6px; font-weight: bold;
        }
        
        /* 优化：背景层透明度平滑过渡 */
        #preview-overlay { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: #000; z-index: 1000; 
            flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.12s ease-in;
        }

        #preview-video { 
            width: 100%; max-height: 85%; 
            border-top: 1px solid #0f0; border-bottom: 1px solid #0f0; 
            background: #000; outline: none;
        }

        .btn-close { 
            margin-top: 20px; padding: 12px 80px; 
            background: #0f0; color: #000; 
            font-weight: bold; cursor: pointer; 
            border-radius: 4px; font-size: 16px; border: none;
        }
    </style>
</head>
<body>

<div class="grid-matrix" id="container"></div>

<div id="preview-overlay">
    <video id="preview-video" playsinline webkit-playsinline controls preload="none" muted></video>
    <div class="btn-close" onclick="closePreview()">BACK</div>
</div>

<script>
    const container = document.getElementById('container');
    const overlay = document.getElementById('preview-overlay');
    const preVideo = document.getElementById('preview-video');

    for (let i = 1; i <= 18; i++) {
        let n = i.toString().padStart(2, '0');
        const card = document.createElement('div');
        card.className = 'unit-card';
        card.innerHTML = `<img src="d${n}.jpg" class="poster"><span class="unit-id">${n}</span>`;
        
        // 【核心修改】：彻底删除了原本在后台疯狂下载18个视频的 link preload 堵塞逻辑

        card.onclick = function() {
            // 1. 立即显示遮罩，动画无缝衔接
            overlay.style.display = 'flex';
            setTimeout(() => overlay.style.opacity = '1', 10);
            
            // 2. 赋予视频源
            preVideo.src = `v${n}.mp4`; 
            
            // 3. 【核心修改】：取消可能引发渲染冲突的 .load()，由 play() 直接驱动硬解码
            const playPromise = preVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("浏览器限制了自动播放，引导用户手动点击，或已由安全策略拦截");
                });
            }
            
            window.history.pushState({view: 'video'}, '');
        };
        container.appendChild(card);
    }

    window.onpopstate = function() {
        if (overlay.style.display === 'flex') closePreview(true);
    };

    function closePreview(isBack = false) {
        overlay.style.opacity = '0';
        setTimeout(() => {
            preVideo.pause();
            preVideo.src = "";
            overlay.style.display = 'none';
        }, 120); // 略微缩短退出延迟，体感更清爽
        
        if(!isBack && window.history.state?.view === 'video') {
            window.history.back();
        }
    }
</script>
</body>
</html>
