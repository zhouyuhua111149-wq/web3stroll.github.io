<style>
    body { margin: 0; padding: 10px; background-color: #1a1a1a; color: white; font-family: sans-serif; }
    .matrix-container {
        display: grid;
        /* 默认电脑端：一排 4 或 5 个 */
        grid-template-columns: repeat(4, 1fr); 
        gap: 15px;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* 关键：手机端自适应逻辑 */
    @media (max-width: 600px) {
        .matrix-container {
            /* 手机端改成一排只放 2 个大格子，视觉效果翻倍 */
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px;
        }
        .grid-item {
            min-height: 180px !important; /* 强制拉高格子 */
        }
        .grid-item p {
            font-size: 16px !important; /* 手机端文字加大 */
        }
    }

    .grid-item {
        border: 2px solid #00ff00;
        background: #222;
        border-radius: 10px;
        overflow: hidden;
        text-align: center;
        min-height: 220px;
        transition: transform 0.2s;
    }
    .grid-item img { width: 100%; height: 140px; object-fit: cover; display: block; background: #333; }
    .grid-item p { padding: 10px; margin: 0; font-size: 14px; color: #00ff00; }
    .ad-space { width: 100%; height: 80px; background: #333; margin: 15px 0; display: flex; align-items: center; justify-content: center; border: 1px dashed #00ff00; }
</style>
