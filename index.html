<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEB3STROLL | 矩阵管理</title>
<style>
body { margin: 0; padding: 5px; background-color: #050505; color: #00ff00; font-family: 'Consolas', monospace; }

/* 矩阵布局：锁定 6 列 */
.grid-matrix {
display: grid;
grid-template-columns: repeat(6, 1fr);
gap: 4px;
}
@media (max-width: 800px) { .grid-matrix { grid-template-columns: repeat(3, 1fr); } }

.unit-card {
border: 1px solid #222; background: #000;
aspect-ratio: 1/1; position: relative; cursor: pointer;
overflow: hidden; transition: 0.2s;
}
.unit-card:hover { border-color: #00ff00; }

/* 矩阵里的视频：只做封面展示 */
.grid-matrix video { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }

/* 遮罩层 */
#mask {
display: none;
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.9); z-index: 90;
}

/* 大浮窗容器 */
#preview-overlay {
display: none;
position: fixed;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
width: 95vw;
height: 90vh;
z-index: 100;
flex-direction: column;
align-items: center;
justify-content: center;
}

#preview-video {
max-width: 100%;
max-height: 90%;
border: 1px solid #00ff00;
box-shadow: 0 0 30px rgba(0,255,0,0.3);
background: #000;
object-fit: contain;
}

.close-hint {
margin-bottom: 10px;
color: #00ff00; font-size: 14px; letter-spacing: 2px;
font-weight: bold;
}
</style>
</head>
<body>

<div class="grid-matrix" id="container"></div>

<div id="mask"></div>
<div id="preview-overlay">
<div class="close-hint">LIVE VIEWING - CLICK TO CLOSE</div>
<video id="preview-video" playsinline loop controls></video>
</div>

<script>
const GATEWAY = "https://4everland.io/ipfs/";
const videoMap = {
"01": "bafybeiddtqqxth7llo5s67mzvbyyemjk3tk4lwcwhqe2kics2flawfi2mq",
"02": "bafybeiealxfxgfc3qrutdbrqcdgrrsewue5bcopq6h6nzefah4j6c6xdue",
"03": "bafybeiblouatfk2narnq6l3h5uyjlw2pme2w6xirkuifgvxw4sn3vqk7gm",
"04": "bafybeigeoqstaif2ymlwwchnd76g6mykusotuaatqwuggldwt7un5fcm7y",
"05": "bafybeicrdtkxzxbbihfx6gemfdcldtt2j6aiekplyhcu2kb7ip5mqt3kii",
"06": "bafybeieq5uq3tf7oyhfp76gfkvzofb4oje6g5oxegas7xkzgosgbzdhiwa",
"07": "bafybeigwylb4n4wnsc6g6ganmue3ntk6wsb4tbabfflde4cfuaiicmn4v4",
"08": "bafybeibok4jlp5alnr7p47r2wfmg5l4tagsfecpyzxyh65broppnpbrsom",
"09": "bafybeichlefmzqqns4zdgmk7mtmm4tpempdz47xr54mshnvf64gneey23q",
"10": "bafybeiej4yhzuq52sdpuluujlpyzprj5t4fbg4ri2xz5nahlgedl7m3fgy",
"11": "bafybeifmjfqha43rewjhhhiflzhzay2k6sszd4wr7s5uwqf4uz56gc5zky",
"12": "bafybeibkpsozjqqzodx7iegq7z5fiavrfviejuccibedpalqddv2k3sica"
};

const container = document.getElementById('container');
const overlay = document.getElementById('preview-overlay');
const mask = document.getElementById('mask');
const preVideo = document.getElementById('preview-video');

for (let i = 1; i <= 24; i++) {
const card = document.createElement('div');
card.className = 'unit-card';
let vidKey = (i % 12 === 0) ? "12" : (i % 12).toString().padStart(2, '0');
let url = GATEWAY + videoMap[vidKey];

// 初始矩阵视频：不加 autoplay，只预加载元数据显示第一帧
card.innerHTML = `<video src="${url}" muted playsinline preload="metadata"></video>`;

card.onclick = function() {
// 仅在点击时，才把地址给大浮窗并开始播放
preVideo.src = url;
preVideo.muted = false;
mask.style.display = 'block';
overlay.style.display = 'flex';
preVideo.play();
};

container.appendChild(card);
}

const closePreview = () => {
preVideo.pause();
preVideo.src = ""; // 清空地址，彻底停止后台下载
mask.style.display = 'none';
overlay.style.display = 'none';
};

mask.onclick = closePreview;
overlay.onclick = closePreview;
</script>
</body>
</html>
