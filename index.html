<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WEB3STROLL | NATIVE FULLSCREEN</title>
    <style>
        /* 全屏核心设置 */
        body { 
            margin: 0; 
            padding: 5px; 
            background: #000; 
            color: #0f0; 
            font-family: 'Consolas', monospace; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent; 
        }

        /* 释放宽度限制，实现电脑满屏 */
        .grid-matrix { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); /* 电脑端默认6列 */
            gap: 8px; 
            width: 100%; /* 满屏关键 */
            margin: 0 auto; 
        }

        /* 手机端自动切换为3列 */
        @media (max-width: 900px) { 
            .grid-matrix { grid-template-columns: repeat(3, 1fr); gap: 5px; } 
        }

        .unit-card { 
            border: 1px solid #1a1a1a; 
            background: #0a0a0a; 
            aspect-ratio: 1/1; 
            position: relative; 
            overflow: hidden; 
            cursor: pointer; 
            transition: transform 0.2s, border-color 0.2s;
        }
        
        .unit-card:hover { 
            border-color: #0f0; 
            transform: scale(1.02); 
            z-index: 10;
        }

        .poster { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        .unit-id { 
            position: absolute; 
            bottom: 2px; 
            right: 4px; 
            font-size: 11px; 
            color: #0f0; 
            background: rgba(0,0,0,0.8); 
            padding: 0 5px; 
            border: 1px solid #0f0; 
            font-weight: bold;
        }
        
        /* 播放器覆盖层 */
        #preview-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            z-index: 1000; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        #preview-video { 
            width: 100%; 
            max-height: 85%; 
            border-top: 2px solid #0f0; 
            border-bottom: 2px solid #0f0; 
            background: #000; 
        }

        .btn-close { 
            margin-top: 20px; 
            padding: 15px 100px; 
            background: #0f0; 
            color: #000; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 5px; 
            font-size: 18px; 
            border: none;
            box-shadow: 0 0 15px rgba(0,255,0,0.3);
        }
    </style>
</head>
<body>

<div class="grid-matrix" id="container"></div>

<div id="preview-overlay">
    <video id="preview-video" playsinline controls preload="auto"></video>
    <div class="btn-close" onclick="closePreview()">BACK TO MATRIX</div>
</div>

<script>
    const container = document.getElementById('container');
    const overlay = document.getElementById('preview-overlay');
    const preVideo = document.getElementById('preview-video');

    // 严谨生成 18 个节点
    for (let i = 1; i <= 18; i++) {
        let n = i.toString().padStart(2, '0');
        const card = document.createElement('div');
        card.className = 'unit-card';
        
        // 匹配你的新命名：d01.jpg, d02.jpg ...
        card.innerHTML = `
            <img src="d${n}.jpg" class="poster">
            <span class="unit-id">NODE-${n}</span>
        `;
        
        card.onclick = function() {
            // 手机防退出：利用 History API
            window.history.pushState({view: 'video'}, '');
            
            overlay.style.display = 'flex';
            // 匹配你的新命名：v01.mp4, v02.mp4 ...
            preVideo.src = `v${n}.mp4`; 
            preVideo.load();
            preVideo.play().catch(() => {
                console.log("Waiting for user interaction...");
            });
        };
        container.appendChild(card);
    }

    // 处理手机物理返回键
    window.onpopstate = function() {
        if (overlay.style.display === 'flex') {
            closePreview(true);
        }
    };

    function closePreview(isBack = false) {
        preVideo.pause();
        preVideo.src = "";
        overlay.style.display = 'none';
        if(!isBack && window.history.state?.view === 'video') {
            window.history.back();
        }
    }
</script>
</body>
</html>
