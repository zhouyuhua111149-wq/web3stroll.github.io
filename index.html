<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Web3Stroll - 自动化工厂</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #1a1a1a; color: white; font-family: sans-serif; }
        .matrix-container {
            display: grid;
            /* 5列布局 */
            grid-template-columns: repeat(5, 1fr); 
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid-item {
            border: 2px solid #444;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.2s;
        }
        .grid-item:hover { transform: scale(1.05); border-color: #00ff00; }
        .grid-item img { width: 100%; height: auto; display: block; background: #333; }
        .grid-item p { padding: 8px; margin: 0; font-size: 14px; }
        .ad-space { width: 100%; height: 100px; background: #333; margin: 20px 0; display: flex; align-items: center; justify-content: center; border: 2px dashed #666; }
    </style>
</head>
