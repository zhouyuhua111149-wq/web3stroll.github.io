<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WEB3STROLL | VIDEO TURBO</title>
<style>
body {
margin: 0; padding: 5px; background: #000; color: #0f0;
font-family: 'Consolas', monospace; overflow-x: hidden;
-webkit-tap-highlight-color: transparent;
}

.grid-matrix {
display: grid; grid-template-columns: repeat(6, 1fr);
gap: 6px; width: 100%; margin: 0 auto;
}

@media (max-width: 900px) {
.grid-matrix { grid-template-columns: repeat(3, 1fr); gap: 4px; }
}

.unit-card {
border: 1px solid #1a1a1a; background: #0a0a0a;
aspect-ratio: 1/1; position: relative; overflow: hidden;
cursor: pointer;
}

.poster { width: 100%; height: 100%; object-fit: cover; }

.unit-id {
position: absolute; bottom: 0; right: 0;
font-size: 12px; color: #0f0;
background: rgba(0,0,0,0.85);
padding: 2px 6px; font-weight: bold;
}

#preview-overlay {
display: none; position: fixed; top: 0; left: 0;
width: 100%; height: 100%; background: #000; z-index: 1000;
flex-direction: column; align-items: center; justify-content: center;
}

/* 原生的 video 样式 */
#preview-video {
width: 100%; max-height: 85%;
border-top: 1px solid #0f0; border-bottom: 1px solid #0f0;
background: #000; outline: none;
object-fit: contain;
}

/* 专门为多吉云准备的 iframe 播放容器样式，尺寸和 video 保持完全一致 */
#preview-iframe {
display: none;
width: 100%; height: 85%;
border-top: 1px solid #0f0; border-bottom: 1px solid #0f0;
background: #000;
}

.btn-close {
margin-top: 20px; padding: 12px 80px;
background: #0f0; color: #000;
font-weight: bold; cursor: pointer;
border-radius: 4px; font-size: 16px; border: none;
}
</style>
</head>
<body>

<div class="grid-matrix" id="container"></div>

<div id="preview-overlay">
<video id="preview-video" controls preload="auto" playsinline webkit-playsinline></video>

<iframe id="preview-iframe" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>

<div class="btn-close" onclick="closePreview()">BACK</div>
</div>

<script>
const container = document.getElementById('container');
const overlay = document.getElementById('preview-overlay');
const preVideo = document.getElementById('preview-video');
const preIframe = document.getElementById('preview-iframe');

for (let i = 1; i <= 18; i++) {
let n = i.toString().padStart(2, '0');
const card = document.createElement('div');
card.className = 'unit-card';
card.innerHTML = `<img src="d${n}.jpg" class="poster"><span class="unit-id">${n}</span>`;

card.onclick = function() {
overlay.style.display = 'flex';

// 🚨 针对 18 号视频进行多吉云链接验证
if (i === 18) {
preVideo.style.display = 'none'; // 隐藏原生 video
preIframe.style.display = 'block'; // 显示多吉云 iframe

// 填入你刚才发我的 18 号多吉云真实直链，并把自动播放改为 true 方便测试
preIframe.src = "https://player.dogecloud.com/web/player.html?vcode=d73a4cca177b7394&userId=15139&autoPlay=true&inFrame=true";
}
// 01 到 17 号依然走你原本的本地测试路径
else {
preIframe.style.display = 'none';
preVideo.style.display = 'block';

preVideo.poster = `d${n}.jpg`;
preVideo.src = `v${n}.mp4`;
preVideo.play().catch(err => console.log("等待手动点击: ", err));
}

window.history.pushState({view: 'video'}, '');
};
container.appendChild(card);
}

window.onpopstate = function() {
if (overlay.style.display === 'flex') closePreview(true);
};

function closePreview(isBack = false) {
// 同时复位两个播放器
preVideo.pause();
preVideo.src = "";
preVideo.removeAttribute('poster');

preIframe.src = "";

overlay.style.display = 'none';

if(!isBack && window.history.state?.view === 'video') {
window.history.back();
}
}
</script>
</body>
</html>
